server.port=8080
spring.application.name=Assignment3_ChatServer_Optimized

# AWS Configuration
aws.region=us-west-2
aws.account.id=211125351505

# Database Configuration
spring.datasource.url=jdbc:mysql://172.31.26.160:3306/chatServerDB
spring.datasource.username=vatsalya
spring.datasource.password=Vatsalya2024!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool - OPTIMIZED FOR HIGH THROUGHPUT
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=30
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=ServerHikariCP
spring.datasource.hikari.auto-commit=true

# WebSocket Configuration - OPTIMIZED
spring.websocket.send-time-limit=60000
spring.websocket.send-buffer-size=524288

# Performance Tuning - CRITICAL FOR BATCH PROCESSING
spring.task.execution.pool.core-size=100
spring.task.execution.pool.max-size=200
spring.task.execution.pool.queue-capacity=5000

# Logging - Reduce noise under load
logging.level.server=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.web.socket=WARN