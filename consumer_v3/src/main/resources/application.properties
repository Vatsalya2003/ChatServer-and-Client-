spring.application.name=consumer_ultra_optimized
server.port=8081

# AWS Configuration
aws.region=us-west-2
aws.account.id=211125351505

# SQS Consumer Settings - OPTIMIZED
consumer.threads=80
consumer.polling.wait.seconds=20
consumer.batch.size=10

# Server Broadcast Configuration
server.broadcast.url=http://localhost:8080/api/broadcast

# Database Configuration
spring.datasource.url=jdbc:mysql://172.31.26.160:3306/chatServerDB
spring.datasource.username=vatsalya
spring.datasource.password=Vatsalya2024!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool - ULTRA OPTIMIZED
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=ConsumerHikariCP

# Database Writer Configuration - OPTIMIZED
database.writer.batch.size=500
database.writer.threads=8
database.writer.flush.interval.ms=500

# Logging Configuration - Reduce noise
logging.level.com.chatapp.consumer=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.org.apache.http=WARN
logging.level.org.springframework.web=WARN

# Performance Tuning - CRITICAL
spring.task.execution.pool.core-size=100
spring.task.execution.pool.max-size=200
spring.task.execution.pool.queue-capacity=5000